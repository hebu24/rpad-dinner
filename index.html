<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R-PAD Dinner</title>
  <style>
    body {
      margin: 0;
      background: #fff8ef;
      color: #301c17;
      font-family: system-ui, sans-serif;
    }

    header {
      position: absolute;
      inset-block-start: 0;
      inset-inline-start: 0;
      padding: 1.5rem clamp(1rem, 4vw, 3rem);
      color: #8d2c24;
      font-size: 0.95rem;
      font-weight: 650;
    }

    main {
      box-sizing: border-box;
      min-height: 100svh;
      display: grid;
      place-content: center;
      padding: 4rem 1rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #8d2c24;
      font-family: Georgia, serif;
      font-size: clamp(2.75rem, 9vw, 7rem);
      line-height: 1.05;
      letter-spacing: -0.05em;
    }

    p {
      margin: 1rem 0 0;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>Trust our taste</header>
  <main>
    <h1>R-PAD Dinner</h1>
    <p>What to eat around CMU</p>
  </main>
</body>
</html>
