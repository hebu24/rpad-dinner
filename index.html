<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R-PAD Dinner</title>
  <style>
    body {
      margin: 0;
      background: #fff8ef;
      color: #301c17;
      font-family: system-ui, sans-serif;
    }

    header {
      position: absolute;
      inset-block-start: 0;
      inset-inline-start: 0;
      padding: 1.5rem clamp(1rem, 4vw, 3rem);
      color: #8d2c24;
      font-size: 0.95rem;
      font-weight: 650;
    }

    .panel {
      box-sizing: border-box;
      min-height: 100svh;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 5rem 1rem 3rem;
      text-align: center;
    }

    h1, h2 {
      margin: 0;
      color: #8d2c24;
      font-family: Georgia, serif;
      line-height: 1.05;
      letter-spacing: -0.05em;
    }

    h1 { font-size: clamp(2.75rem, 9vw, 7rem); }
    h2 { font-size: clamp(2.25rem, 6vw, 4rem); }

    p {
      margin: 1rem 0 0;
      max-width: 32rem;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      line-height: 1.5;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .button {
      border: 1px solid #8d2c24;
      border-radius: 0.5rem;
      padding: 0.75rem 1.25rem;
      color: #8d2c24;
      font-weight: 650;
      text-decoration: none;
    }

    .button-primary, .button:hover {
      background: #8d2c24;
      color: #fff8ef;
    }

    .button-primary:hover { background: #6f201a; }
    .back { margin-top: 2rem; color: #8d2c24; }
    a:focus-visible { outline: 2px solid #301c17; outline-offset: 4px; }

    .destination { display: none; }
    .destination:target { display: grid; }
    main:has(.destination:target) #home { display: none; }
  </style>
</head>
<body>
  <header>Trust our taste</header>
  <main>
    <section class="panel" id="home" aria-labelledby="home-title">
      <h1 id="home-title">R-PAD Dinner</h1>
      <p>What to eat around CMU</p>
      <nav aria-label="Explore R-PAD Dinner">
        <a class="button button-primary" href="#food-rankings">Food Rankings</a>
        <a class="button" href="#about-rpad">About R-PAD</a>
      </nav>
    </section>
    <section class="panel destination" id="food-rankings" aria-labelledby="rankings-title">
      <h2 id="rankings-title">Food Rankings</h2>
      <p>Rankings coming soon.</p>
      <a class="back" href="#home">Back to home</a>
    </section>
    <section class="panel destination" id="about-rpad" aria-labelledby="about-title">
      <h2 id="about-title">About R-PAD</h2>
      <p>R-PAD Dinner reviews food around Carnegie Mellon University.</p>
      <a class="back" href="#home">Back to home</a>
    </section>
  </main>
</body>
</html>
